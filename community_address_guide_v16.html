<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>社區門牌導引 V16</title>
<meta name="theme-color" content="#2563EB">
<meta name="color-scheme" content="light">
<meta name="application-name" content="社區門牌導引">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="門牌導引">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <style>
    :root {
      --primary:#2563EB;
      --primary-dark:#16325C;
      --background:#F4F7FB;
      --destination:#F59E0B;
      --success:#16A34A;
      --danger:#DC2626;
      --text:#1F2937;
      --muted:#64748B;
      --line:#D8E1EC;
      --card:#FFFFFF;
      --disabled:#CBD5E1;
      --shadow:0 10px 30px rgba(22,50,92,.10);
      --a:#F7B3B3;
      --b:#F6D37B;
      --c:#A8DDA0;
      --d:#D5B7EA;
    }
    * { box-sizing:border-box; }
    html,body {
      margin:0; min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      background:var(--background); color:var(--text);
    }
    body { display:flex; justify-content:center; }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .app {
      width:100%; max-width:480px; min-height:100dvh;
      background:var(--background); overflow:hidden; position:relative;
    }
    .screen { display:none; min-height:100dvh; }
    .screen.active { display:flex; flex-direction:column; }

    /* 首頁 */
    #homeScreen {
      height:100dvh; min-height:0; overflow:hidden;
      justify-content:flex-start;
    }
    .home-grid {
      width:100%; min-height:0; display:flex; flex-direction:column;
      justify-content:flex-start; gap:10px;
      padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
    }
    .panel {
      flex:0 0 auto; min-height:0; background:var(--card); border-radius:18px;
      box-shadow:var(--shadow); border:1px solid rgba(37,99,235,.06);
      padding:13px 16px;
      display:flex; flex-direction:column; justify-content:center;
    }
    .brand-row { display:flex; align-items:center; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(22px,3.8vh,26px); line-height:1.2; color:var(--primary-dark); }
    h2 { font-size:23px; line-height:1.35; color:var(--primary-dark); }
    h3 { font-size:20px; line-height:1.35; color:var(--primary-dark); }
    .location { margin-top:4px; color:var(--muted); font-size:clamp(14px,2.35vh,17px); font-weight:650; }
    .section-label {
      font-size:clamp(18px,2.8vh,20px); font-weight:850; color:var(--primary-dark); margin-bottom:8px;
    }
    .address-input-wrap {
      display:flex; align-items:center; border:3px solid #BFD1F6;
      background:#F8FBFF; border-radius:16px; padding:5px 13px 5px 17px;
      transition:.2s ease;
    }
    .address-input-wrap:focus-within {
      border-color:var(--primary); box-shadow:0 0 0 5px rgba(37,99,235,.11); background:#fff;
    }
    #addressInput {
      border:0; outline:0; background:transparent; width:100%; min-width:0;
      font-size:clamp(32px,5.8vh,38px); font-weight:850; color:var(--primary-dark);
      text-align:center; padding:4px;
    }
    .address-suffix { font-size:clamp(21px,3.4vh,24px); font-weight:850; color:var(--primary-dark); white-space:nowrap; }
    .transport-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .transport-btn {
      min-height:54px; border:2px solid #DCE6F5; border-radius:16px;
      background:#fff; color:var(--primary-dark); font-size:20px; font-weight:850;
      cursor:pointer; display:flex; justify-content:center; align-items:center;
      transition:.18s ease;
    }
    .transport-btn.selected {
      background:var(--primary); color:#fff; border-color:var(--primary);
      box-shadow:0 8px 18px rgba(37,99,235,.25);
    }
    .primary-btn {
      width:100%; min-height:54px; border:0; border-radius:16px;
      background:var(--primary); color:#fff; font-size:21px; font-weight:850;
      cursor:pointer; box-shadow:0 10px 20px rgba(37,99,235,.24);
    }
    .primary-btn:disabled { background:var(--disabled); box-shadow:none; cursor:not-allowed; }

    /* 共用頁首 */
    .topbar {
      display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:10px;
      padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
      background:#fff; border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:20;
    }
    .back-btn {
      width:38px; height:38px; border-radius:12px; border:0;
      background:#EAF1FE; color:var(--primary); font-size:24px; cursor:pointer;
      flex:0 0 auto;
    }
    .mode-pill {
      min-width:72px; border:1px solid #AFC3E0; background:#F7FAFF; color:var(--primary-dark);
      border-radius:999px; padding:8px 14px; font-size:14px; font-weight:850;
      white-space:nowrap; cursor:pointer;
    }
    .mode-pill:active { transform:scale(.97); }
    .address-pill {
      justify-self:center; width:min(100%,150px); min-height:38px; border:1px solid #AFC3E0;
      background:#F7FAFF; color:var(--primary-dark); border-radius:999px;
      padding:7px 14px; font-size:17px; font-weight:900; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; cursor:pointer;
    }
    .address-pill::after { content:"⌄"; margin-left:7px; color:var(--primary); font-size:14px; }
    .address-pill:active { transform:scale(.98); }

    /* 地圖頁門牌滾輪 */
    .picker-overlay {
      position:fixed; inset:0; z-index:100; display:flex; justify-content:center; align-items:flex-end;
      background:rgba(15,23,42,.42); opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    .picker-overlay.active { opacity:1; pointer-events:auto; }
    .picker-sheet {
      width:min(100%,480px); background:#fff; border-radius:24px 24px 0 0;
      padding:10px 14px calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -16px 45px rgba(15,23,42,.20);
      transform:translateY(105%); transition:transform .24s ease;
    }
    .picker-overlay.active .picker-sheet { transform:translateY(0); }
    .picker-grabber { width:42px; height:5px; border-radius:999px; background:#D6DEE9; margin:0 auto 7px; }
    .picker-header {
      display:grid; grid-template-columns:72px 1fr 72px; align-items:center; min-height:42px;
      border-bottom:1px solid var(--line);
    }
    .picker-header strong { text-align:center; color:var(--primary-dark); font-size:18px; }
    .picker-action {
      border:0; background:transparent; color:var(--primary); font-size:16px; font-weight:850;
      min-height:40px; cursor:pointer;
    }
    .picker-action:first-child { text-align:left; }
    .picker-action:last-child { text-align:right; }
    .wheel-wrap { position:relative; height:260px; overflow:hidden; }
    .wheel-highlight {
      position:absolute; left:12px; right:12px; top:104px; height:52px; z-index:0;
      border-top:1px solid #C8D6E8; border-bottom:1px solid #C8D6E8;
      background:#F4F8FF; border-radius:12px; pointer-events:none;
    }
    .address-wheel {
      position:relative; z-index:1; height:260px; overflow-y:auto; padding:104px 0;
      scroll-snap-type:y mandatory; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .address-wheel::-webkit-scrollbar { display:none; }
    .picker-item {
      width:100%; height:52px; border:0; background:transparent; color:#7A8798;
      display:flex; justify-content:center; align-items:center; scroll-snap-align:center;
      font-size:22px; font-weight:750; cursor:pointer; transition:.15s ease;
    }
    .picker-item.selected { color:var(--primary-dark); font-size:31px; font-weight:900; }
    body.picker-open { overflow:hidden; touch-action:none; }

    /* 地圖頁 */
    .map-section { padding:10px; display:flex; flex-direction:column; gap:9px; flex:1; }
    .map-card {
      order:1; background:#fff; border-radius:18px; padding:7px; box-shadow:var(--shadow);
      position:relative; overflow:hidden;
    }
    .map-frame {
      position:relative; width:100%; border-radius:18px; overflow:hidden;
      background:#EAF0E7; border:1px solid #D7E2D5;
    }
    .map-image {
      display:block; width:100%; height:auto; max-height:57vh;
      object-fit:contain; user-select:none;
    }
    .map-dimmer {
      position:absolute; inset:0; z-index:4; background:rgba(18,36,58,.50);
      opacity:0; pointer-events:none; transition:.2s ease;
    }
    .map-dimmer.active { opacity:1; }

    .route-layer {
      position:absolute; inset:0; width:100%; height:100%;
      z-index:5; pointer-events:none; opacity:0; transition:.2s ease;
    }
    .route-layer.active { opacity:1; }
    #routeShadow {
      stroke:#FFFFFF; stroke-width:9; stroke-linecap:round; stroke-linejoin:round;
    }
    #routeLine {
      stroke:#2563EB; stroke-width:5; stroke-linecap:round; stroke-linejoin:round;
    }
    #routeStart {
      fill:#16A34A; stroke:#FFFFFF; stroke-width:2.5;
    }
    #routeEnd {
      fill:#F59E0B; stroke:#FFFFFF; stroke-width:2.5;
    }

    .building-target {
      position:absolute; z-index:6; pointer-events:none;
      border:3px solid #FFFFFF; border-radius:10px;
      background:rgba(245,158,11,.34);
      box-shadow:0 0 0 4px rgba(245,158,11,.96), 0 7px 16px rgba(22,50,92,.30);
      opacity:0; transform:scale(.96); transition:.2s ease;
    }
    .building-target.active { opacity:1; transform:scale(1); }
    .building-target span {
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      background:var(--destination); color:#1F2937; font-size:13px; line-height:1;
      font-weight:900; padding:6px 8px; border-radius:999px; white-space:nowrap;
      box-shadow:0 3px 8px rgba(0,0,0,.18);
    }

    .map-tip {
      margin:6px 2px 0; padding:8px 10px; border-radius:11px;
      background:#EFF5FF; color:var(--primary-dark); font-size:13px;
      line-height:1.4; font-weight:700; display:flex; gap:7px; align-items:flex-start;
    }
    .steps-card {
      order:2; background:#fff; border-radius:16px; padding:11px 13px;
      box-shadow:0 10px 26px rgba(22,50,92,.13);
      border:1px solid #DCE7F7;
    }
    .destination-summary {
      order:2; background:#fff; border-radius:15px; padding:10px 12px;
      box-shadow:var(--shadow); display:grid;
      grid-template-columns:34px 1fr auto; gap:9px; align-items:center;
    }
    .summary-pin {
      width:32px; height:32px; border-radius:50%; background:#EAF8EC;
      display:grid; place-items:center; font-size:17px;
    }
    .summary-main { min-width:0; }
    .summary-main strong {
      display:block; color:var(--primary-dark); font-size:16px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .summary-main span {
      display:block; color:var(--muted); font-size:12px; margin-top:2px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .summary-time {
      border-radius:999px; background:#EAF8EC; color:#16803A;
      padding:6px 9px; font-size:11px; font-weight:850; white-space:nowrap;
    }
    .compact-restart {
      order:3; width:100%; min-height:42px; border:0; border-radius:13px;
      background:var(--success); color:#fff; font-size:15px; font-weight:850;
      box-shadow:0 7px 15px rgba(22,163,74,.18); cursor:pointer;
    }
    .eyebrow {
      color:var(--destination); font-size:15px; font-weight:900; margin-bottom:5px;
    }
    .route-title {
      color:var(--primary); font-size:16px; font-weight:900; margin-bottom:7px;
    }
    .route-intro {
      margin:3px 0 5px; color:var(--muted); font-size:12px; line-height:1.4;
    }
    .map-info p,.zone-copy { margin-top:5px; color:var(--muted); font-size:14px; line-height:1.45; }
    .zone-list-title { margin-bottom:12px; }
    .zone-grid { display:grid; gap:10px; }
    .zone-card {
      width:100%; border:1px solid var(--line); border-radius:13px;
      background:#fff; text-align:left; padding:10px; cursor:default;
      display:grid; grid-template-columns:40px 1fr; gap:9px; align-items:start;
    }
    .zone-card.active {
      border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.10);
      background:#F8FBFF;
    }
    .zone-badge {
      width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
      font-size:18px; font-weight:900; color:#273244;
    }
    .zone-card strong { display:block; font-size:16px; color:var(--primary-dark); margin-bottom:2px; }
    .zone-card span { color:var(--muted); font-size:13px; line-height:1.35; }
    .a-bg { background:var(--a); }
    .b-bg { background:var(--b); }
    .c-bg { background:var(--c); }
    .d-bg { background:var(--d); }

    .continue-btn { margin-top:12px; }
    .steps-card { display:block; }
    .steps-card.show { display:block; }
    .step {
      display:grid; grid-template-columns:28px 1fr; gap:8px;
      padding:8px 0; border-bottom:1px solid var(--line); align-items:start;
    }
    .step:last-child { border-bottom:0; }
    .step-number {
      width:26px; height:26px; border-radius:50%; background:#EAF1FE;
      color:var(--primary); display:grid; place-items:center; font-size:13px; font-weight:900;
    }
    .step p { font-size:14px; line-height:1.4; color:var(--text); }
    .warning {
      margin-top:8px; background:#FFF8E5; color:#6B4D00; border-radius:11px;
      padding:9px 10px; font-size:12px; line-height:1.4; font-weight:700;
    }


    @media (max-width:480px) {
      .map-section { padding:7px; gap:7px; }
      .map-card { border-radius:15px; padding:5px; }
      .map-frame { border-radius:12px; }
      .steps-card { padding:9px 10px; border-radius:14px; }
      .steps-card h2 { font-size:17px; }
      .eyebrow { font-size:12px; margin-bottom:2px; }
      .map-tip { display:none; }
      .mode-pill { max-width:90px; overflow:hidden; text-overflow:ellipsis; }
      .cluster[data-label]::after { font-size:12px; padding:5px 7px; }
    }

    @media (max-width:390px) {
      .home-grid { gap:8px; padding:8px 10px; }
      .panel { padding:11px 14px; border-radius:16px; }
      .transport-btn { min-height:50px; font-size:18px; }
      .primary-btn { min-height:50px; }
      .zone-hit::after { font-size:15px; }
    }
    @media (min-width:700px) {
      body { padding:28px; }
      .app { min-height:850px; border-radius:30px; box-shadow:0 20px 70px rgba(22,50,92,.18); }
      .screen,.home-grid { min-height:850px; }
    }


    /* V10：使用實際區塊圖與 JSON 座標 */
    .map-image { width:100%; height:auto; max-height:none; object-fit:contain; }
    .map-dimmer { background:rgba(18,36,58,.14); }
    .address-status {
      min-height:22px; margin-top:7px; text-align:center; font-size:14px;
      font-weight:800; color:var(--muted);
    }
    .address-status.ok { color:var(--success); }
    .address-status.error { color:var(--danger); }
    .building-target { border-radius:7px; }
    .building-target span { max-width:150px; text-align:center; }
    .data-note { font-size:11px; color:var(--muted); }
    @media (max-height:620px) {
      .home-grid {
        gap:6px; padding-top:calc(6px + env(safe-area-inset-top));
        padding-bottom:calc(6px + env(safe-area-inset-bottom));
      }
      .panel { padding:9px 13px; border-radius:15px; }
      h1 { font-size:21px; }
      .location { margin-top:2px; font-size:14px; }
      .section-label { margin-bottom:6px; font-size:17px; }
      #addressInput { font-size:30px; padding:2px 4px; }
      .transport-btn { min-height:46px; }
      .primary-btn { min-height:47px; }
    }
    @media (max-width:390px) {
      .building-target span { font-size:11px; padding:5px 6px; }
      .map-tip { font-size:12px; }
    }

  </style>
</head>
<body>
<main class="app">
  <section id="homeScreen" class="screen active">
    <div class="home-grid">
      <section class="panel">
        <div class="brand-row">
          <div>
            <h1>社區門牌導引</h1>
            <div class="location">您目前位於：社區入口</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="section-label">您要前往幾號？</div>
        <div class="address-input-wrap">
          <input id="addressInput" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="" autocomplete="off" aria-label="輸入門牌號碼">
          <span class="address-suffix">號</span>
        </div>
      </section>

      <section class="panel">
        <div class="section-label">請選擇交通方式</div>
        <div class="transport-grid">
          <button class="transport-btn" data-mode="機車">機車</button>
          <button class="transport-btn" data-mode="汽車">汽車</button>
        </div>
      </section>

      <section class="panel">
        <button id="viewMapBtn" class="primary-btn" disabled>查看門牌位置</button>
      </section>

    </div>
  </section>

  <section id="mapScreen" class="screen">
    <header class="topbar">
      <button id="backBtn" class="back-btn" aria-label="返回">←</button>
      <button id="addressPill" class="address-pill" type="button" aria-haspopup="dialog" aria-controls="addressPicker">選擇門牌</button>
      <button id="modePill" class="mode-pill" type="button" aria-label="切換交通方式">汽車</button>
    </header>

    <div class="map-section">

  function validateMapData(data) {
    if (!data || typeof data !== 'object' || !data.blocks || !data.houses) return false;
    return Object.values(data.houses).every(blockCode => Boolean(data.blocks[blockCode]));
  }

  async function loadExternalMapData() {
    if (location.protocol === 'file:') return;
    for (const filename of DATA_FILE_CANDIDATES) {
      try {
        const response = await fetch(filename, { cache:'no-store' });
        if (!response.ok) continue;
        const externalData = await response.json();
        if (!validateMapData(externalData)) continue;
        mapData = {
          ...EMBEDDED_MAP_DATA,
          ...externalData,
          metadata: { ...EMBEDDED_MAP_DATA.metadata, ...(externalData.metadata || {}) },
          routing: externalData.routing || EMBEDDED_MAP_DATA.routing,
        };
        updateButtonState();
        buildAddressPicker();
        return;
      } catch (error) {
        // 保留內嵌 V13 資料，確保單一 HTML 或 iPhone 本機開啟時仍可使用。
      }
    }
  }

  function normalizedAddress(value) {
    const digits = String(value || '').replace(/\D/g, '');
    return digits.replace(/^0+(?=\d)/, '');
  }

  function getBlockCode(address) {
    return mapData.houses?.[String(address)] || '';
  }

  function getBlockAddresses(blockCode) {
    if (Array.isArray(mapData.blockHouses?.[blockCode])) return mapData.blockHouses[blockCode];
    return Object.entries(mapData.houses || {})
      .filter(([, code]) => code === blockCode)
      .map(([house]) => Number(house))
      .sort((a,b) => a-b);
  }

  function updateAddressPill() {
    addressPill.textContent = currentAddress ? `${currentAddress} 號` : '選擇門牌';
    addressPill.setAttribute('aria-label', currentAddress
      ? `目前為 ${currentAddress} 號，點一下選擇其他門牌`
      : '選擇門牌');
  }

  function buildAddressPicker() {
    availableAddresses = Object.keys(mapData.houses || {})
      .map(Number)
      .filter(Number.isFinite)
      .sort((a,b) => a-b)
      .map(String);
    addressWheel.innerHTML = availableAddresses.map(address => `
      <button class="picker-item" type="button" role="option" data-address="${address}" aria-selected="false">${address} 號</button>
    `).join('');
    refreshPickerSelection();
  }

  function refreshPickerSelection() {
    [...addressWheel.querySelectorAll('.picker-item')].forEach(item => {
      const selected = item.dataset.address === pendingAddress;
      item.classList.toggle('selected', selected);
      item.setAttribute('aria-selected', selected ? 'true' : 'false');
    });
  }

  function setPendingAddress(address, shouldScroll = false, smooth = false) {
    const value = String(address || '');
    const index = availableAddresses.indexOf(value);
    if (index < 0) return;
    pendingAddress = value;
    refreshPickerSelection();
    if (shouldScroll) {
      addressWheel.scrollTo({ top:index * PICKER_ITEM_HEIGHT, behavior:smooth ? 'smooth' : 'auto' });
    }
  }

  function openAddressPicker() {
    if (!availableAddresses.length) buildAddressPicker();
    const initial = availableAddresses.includes(currentAddress) ? currentAddress : availableAddresses[0];
    setPendingAddress(initial, true, false);
    addressPicker.classList.add('active');
    addressPicker.setAttribute('aria-hidden', 'false');
    document.body.classList.add('picker-open');
  }

  function closeAddressPicker() {
    addressPicker.classList.remove('active');
    addressPicker.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('picker-open');
  }

  function applyPickedAddress() {
    const blockCode = getBlockCode(pendingAddress);
    if (!blockCode) return;
    currentAddress = pendingAddress;
    addressInput.value = currentAddress;
    updateButtonState();
    updateAddressPill();
    renderDestination(currentAddress, blockCode);
    closeAddressPicker();
  }

  function updateButtonState() {
    const address = normalizedAddress(addressInput.value);
    const blockCode = address ? getBlockCode(address) : '';
    viewMapBtn.disabled = !(blockCode && selectedMode);
    viewMapBtn.textContent = address ? `查看 ${address} 號位置` : '查看門牌位置';
  }

  function setSelectedMode(mode) {
    if (!['機車', '汽車'].includes(mode)) return;
    selectedMode = mode;
    transportButtons.forEach(item => item.classList.toggle('selected', item.dataset.mode === mode));
    modePill.textContent = mode;
    modePill.setAttribute('aria-label', `目前為${mode}，點一下切換交通方式`);
    updateButtonState();
  }

  function boxCenter(box) {
    return {
      x: Number(box.x) + Number(box.w) / 2,
      y: Number(box.y) + Number(box.h) / 2,
    };
  }

  function buildRoute(blockCode) {
    const routeMode = selectedMode === '機車' ? 'motorcycle' : 'car';
    const route = mapData.routing?.routes?.[routeMode]?.[blockCode];
    if (!Array.isArray(route) || route.length < 2) return '';
    return route.map(([x,y]) => `${Number(x).toFixed(0)},${Number(y).toFixed(0)}`).join(' ');
  }

  function routeText(blockCode, addressList) {
    const modeExplanation = selectedMode === '機車'
      ? '目前使用機車路線，已包含機車可通行小路並避開禁止通行區域。'
      : '目前使用汽車路線，只會沿灰褐色可行車道路並避開禁止通行區域。';
    const sharedText = addressList.length > 1
      ? `橘色區塊包含 ${addressList.join('、')} 號，抵達後請確認實際門戶。`
      : `抵達橘色標示的 ${blockCode} 區塊，即為 ${addressList[0]} 號所在位置。`;
    return [
      '從黃色入口位置出發，沿地圖上的藍色路線前進。',
      modeExplanation,
      sharedText,
    ];
  }


  function renderDestination(address, blockCode) {
    const box = mapData.blocks[blockCode];
    const addressList = getBlockAddresses(blockCode);
    const sharedLabel = addressList.length > 1 ? `${addressList.join('／')}號` : `${address}號`;

    mapDimmer.classList.add('active');
    const points = buildRoute(blockCode);
    routeLayer.classList.toggle('active', Boolean(points));
    routeLine.setAttribute('points', points);
    routeShadow.setAttribute('points', points);

    buildingTarget.classList.add('active');
    buildingTarget.style.left = `${box.x}%`;
    buildingTarget.style.top = `${box.y}%`;
    buildingTarget.style.width = `${box.w}%`;
    buildingTarget.style.height = `${box.h}%`;
    targetLabel.textContent = sharedLabel;

    const routeMode = selectedMode === '機車' ? 'motorcycle' : 'car';
    const arrival = mapData.routing?.arrivals?.[routeMode]?.[blockCode];
    if (Array.isArray(arrival)) {
      routeEnd.setAttribute('cx', Number(arrival[0]).toFixed(0));
      routeEnd.setAttribute('cy', Number(arrival[1]).toFixed(0));
    }
    const entrance = mapData.routing?.entrance;
    if (entrance) {
      document.getElementById('routeStart').setAttribute('cx', Number(entrance.x).toFixed(0));
      document.getElementById('routeStart').setAttribute('cy', Number(entrance.y).toFixed(0));
    }

    modePill.textContent = selectedMode;
    modePill.setAttribute('aria-label', `目前為${selectedMode}，點一下切換交通方式`);
    updateAddressPill();

    const steps = routeText(blockCode, addressList);
    stepsList.innerHTML = steps.map((text,index) => `
      <div class="step">
        <div class="step-number">${index + 1}</div>
        <p>${text}</p>
      </div>`).join('');
  }

  function resetMapVisuals() {
    mapDimmer.classList.remove('active');
    routeLayer.classList.remove('active');
    routeLine.setAttribute('points', '');
    routeShadow.setAttribute('points', '');
    buildingTarget.classList.remove('active');
  }

  addressInput.addEventListener('input', () => {
    addressInput.value = normalizedAddress(addressInput.value);
    updateButtonState();
  });

  addressInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !viewMapBtn.disabled) viewMapBtn.click();
  });

  transportButtons.forEach(btn => {
    btn.addEventListener('click', () => setSelectedMode(btn.dataset.mode));
  });

  modePill.addEventListener('click', () => {
    const nextMode = selectedMode === '汽車' ? '機車' : '汽車';
    setSelectedMode(nextMode);
    if (currentAddress) {
      const blockCode = getBlockCode(currentAddress);
      if (blockCode) renderDestination(currentAddress, blockCode);
    }
  });

  addressPill.addEventListener('click', openAddressPicker);

  pickerCancel.addEventListener('click', closeAddressPicker);
  pickerDone.addEventListener('click', applyPickedAddress);

  addressPicker.addEventListener('click', event => {
    if (event.target === addressPicker) closeAddressPicker();
  });

  addressWheel.addEventListener('click', event => {
    const item = event.target.closest('.picker-item');
    if (!item) return;
    setPendingAddress(item.dataset.address, true, true);
  });

  addressWheel.addEventListener('scroll', () => {
    if (pickerRaf) cancelAnimationFrame(pickerRaf);
    pickerRaf = requestAnimationFrame(() => {
      const index = Math.max(0, Math.min(
        availableAddresses.length - 1,
        Math.round(addressWheel.scrollTop / PICKER_ITEM_HEIGHT)
      ));
      if (availableAddresses[index]) setPendingAddress(availableAddresses[index], false);
    });
  }, { passive:true });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && addressPicker.classList.contains('active')) closeAddressPicker();
  });

  viewMapBtn.addEventListener('click', () => {
    currentAddress = normalizedAddress(addressInput.value);
    const blockCode = getBlockCode(currentAddress);
    if (!blockCode) {
      updateButtonState();
      return;
    }
    homeScreen.classList.remove('active');
    mapScreen.classList.add('active');
    renderDestination(currentAddress, blockCode);
    window.scrollTo(0,0);
  });

  backBtn.addEventListener('click', () => {
    mapScreen.classList.remove('active');
    homeScreen.classList.add('active');
    window.scrollTo(0,0);
  });

  restartBtn.addEventListener('click', () => {
    resetMapVisuals();
    mapScreen.classList.remove('active');
    homeScreen.classList.add('active');
    addressInput.value = '';
    currentAddress = '';
    pendingAddress = '';
    updateButtonState();
    updateAddressPill();
    window.scrollTo(0,0);
    addressInput.focus();
  });

  buildAddressPicker();
  updateButtonState();
  updateAddressPill();
  loadExternalMapData();
</script>

<script>
  // PWA V16：在 HTTPS 或 localhost 環境註冊離線快取。
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        registration.update();
      } catch (error) {
        console.warn('PWA 離線功能暫時無法啟用：', error);
      }
    });
  }
</script>
</body>
</html>
