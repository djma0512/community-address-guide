<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>社區門牌導引</title>
  <meta name="theme-color" content="#2563EB">
  <meta name="color-scheme" content="light">
  <meta name="application-name" content="社區門牌導引">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="門牌導引">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <script src="./js/app.js" defer></script>
</head>
<body>
  <div id="loadingLayer" class="loading-layer">
    <div id="loadingCard" class="loading-card">
      <strong>正在載入導航資料</strong>
      <p id="loadingMessage">請稍候。</p>
    </div>
  </div>
  <main class="app">
<section class="screen active" id="homeScreen">
<div class="home-grid">
<section class="panel">
<div class="brand-row">
<div>
<h1 id="appTitle">社區門牌導引</h1>
<div class="location" id="locationText">您目前位於：社區入口</div>
</div>
</div>
</section>
<section class="panel">
<div class="section-label" id="questionText">您要前往幾號？</div>
<div class="address-input-wrap">
<input aria-label="輸入門牌號碼" autocomplete="off" id="addressInput" inputmode="numeric" maxlength="3" pattern="[0-9]*" placeholder=""/>
<span class="address-suffix">號</span>
</div>
</section>
<section class="panel">
<div class="section-label" id="transportText">請選擇交通方式</div>
<div class="transport-grid">
<button class="transport-btn" data-mode="機車">機車</button>
<button class="transport-btn" data-mode="汽車">汽車</button>
</div>
</section>
<section class="panel">
<button class="primary-btn" disabled="" id="viewMapBtn">查看門牌位置</button>
</section>
<div class="version-badge" id="versionBadge">V17</div></div>
</section>
<section class="screen" id="mapScreen">
<header class="topbar">
<button aria-label="返回" class="back-btn" id="backBtn">←</button>
<button aria-controls="addressPicker" aria-haspopup="dialog" class="address-pill" id="addressPill" type="button">選擇門牌</button>
<button aria-label="切換交通方式" class="mode-pill" id="modePill" type="button">汽車</button>
</header>
<div class="map-section">
<section class="map-card">
<div class="map-frame" id="mapFrame">
<img alt="全民一家社區 A1 至 H3 區塊配置圖" class="map-image" id="communityMapImage" src="./assets/community-map.png"/>
<div class="map-dimmer" id="mapDimmer"></div>
<svg aria-hidden="true" class="route-layer" id="routeLayer" preserveaspectratio="none" viewbox="0 0 503 571">
<defs>
<marker id="routeArrow" markerheight="8" markerunits="strokeWidth" markerwidth="8" orient="auto" refx="6" refy="3">
<path d="M0,0 L0,6 L7,3 z" fill="#2563EB"></path>
</marker>
</defs>
<polyline fill="none" id="routeShadow" points=""></polyline>
<polyline fill="none" id="routeLine" marker-end="url(#routeArrow)" points=""></polyline>
<circle cx="238" cy="543" id="routeStart" r="6.5"></circle>
<circle cx="250" cy="285" id="routeEnd" r="7"></circle>
</svg>
<div aria-hidden="true" class="building-target" id="buildingTarget">
<span id="targetLabel">門牌</span>
</div>
</div>
</section>
<section class="steps-card show" id="stepsCard">
<div class="route-title">文字導航</div>
<div id="stepsList"></div>
</section>
<button class="compact-restart" id="restartBtn">重新選擇門牌</button>
</div>
</section>
<div aria-hidden="true" class="picker-overlay" id="addressPicker">
<div aria-labelledby="pickerTitle" aria-modal="true" class="picker-sheet" role="dialog">
<div class="picker-grabber"></div>
<div class="picker-header">
<button class="picker-action" id="pickerCancel" type="button">取消</button>
<strong id="pickerTitle">選擇門牌</strong>
<button class="picker-action" id="pickerDone" type="button">完成</button>
</div>
<div class="wheel-wrap">
<div aria-hidden="true" class="wheel-highlight"></div>
<div aria-label="門牌號碼" class="address-wheel" id="addressWheel" role="listbox"></div>
</div>
</div>
</div>
</main>
</body>
</html>
